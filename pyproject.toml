[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clip-virality-scorer"
version = "0.1.0"
description = "Rank candidate short-form clips cut from long recordings: heuristic baseline plus an XGBoost model trained on creator-normalised engagement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kaan Kuzu" }]
dependencies = []

[project.urls]
Repository = "https://github.com/kaankuzu1/clip-virality-scorer"

[project.scripts]
clip-scorer = "clip_scorer.cli:main"

[project.optional-dependencies]
xgb = ["numpy>=1.24", "xgboost>=2.0", "joblib>=1.3", "scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/clip_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
